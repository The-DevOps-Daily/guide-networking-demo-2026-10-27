name: guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: netlab.sh on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the packages from Part 1
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q iproute2 iputils-ping iputils-tracepath iputils-arping traceroute mtr-tiny \
            tcpdump nftables conntrack curl netcat-openbsd openssl python3 ipcalc iperf3 wireguard-tools \
            bind9 bind9-dnsutils unbound nginx haproxy
          sudo systemctl disable --now named unbound nginx haproxy
      - name: Lab up
        run: sudo ./netlab.sh up
      - name: Smoke test
        run: sudo bash scripts/lab-smoke.sh
      - name: Status and logs
        if: always()
        run: |
          sudo ./netlab.sh status || true
          sudo tail -n 20 /var/log/netlab/*.log || true
      - name: Lab down
        if: always()
        run: sudo ./netlab.sh down

  docker:
    name: Part 6, Docker
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/part06-docker.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-06-docker
          path: part06/captures/

  kubernetes:
    name: Parts 6 and 10, Kubernetes (kind)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      KIND_VERSION: v0.33.0
      KUBECTL_VERSION: v1.37.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kind and kubectl (checksums verified)
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind.sha256 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          echo "$(cut -d' ' -f1 kind.sha256)  kind" | sha256sum -c -
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLo kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          install -m 0755 kind kubectl "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: bash scripts/part06-k8s.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-06-k8s
          path: part06/captures/
      - run: bash scripts/part10-dryrun.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-10
          path: part10/captures/

  cloud-cli:
    name: Part 7, cloud CLI syntax (no credentials)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      DOCTL_VERSION: 2.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install doctl (checksum verified)
        run: |
          base="https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}"
          curl -fsSLO "$base/doctl-${DOCTL_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "$base/doctl-${DOCTL_VERSION}-checksums.sha256"
          grep "linux-amd64.tar.gz" "doctl-${DOCTL_VERSION}-checksums.sha256" | sha256sum -c -
          tar -xzf "doctl-${DOCTL_VERSION}-linux-amd64.tar.gz"
          sudo install -m 0755 doctl /usr/local/bin/doctl
      - run: bash scripts/part07-cli.sh

  promtool:
    name: Part 8, alert rules
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      PROM_VERSION: 3.15.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install promtool (checksum verified)
        run: |
          base="https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}"
          curl -fsSLO "$base/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "$base/sha256sums.txt"
          grep " prometheus-${PROM_VERSION}.linux-amd64.tar.gz" sha256sums.txt | sha256sum -c -
          tar -xzf "prometheus-${PROM_VERSION}.linux-amd64.tar.gz" --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          sudo install -m 0755 promtool /usr/local/bin/promtool
      - run: bash scripts/part08-promtool.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-08
          path: part08/captures/

  ansible:
    name: Part 9, Ansible
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ansible-core, ansible-lint and community.docker
        run: |
          python3 -m venv "$HOME/ansible"
          "$HOME/ansible/bin/pip" install -q ansible-core==2.21.5 ansible-lint==26.10.1
          "$HOME/ansible/bin/ansible-galaxy" collection install community.docker:==5.4.0
          echo "$HOME/ansible/bin" >> "$GITHUB_PATH"
      - run: bash scripts/part09-ansible.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-09-ansible
          path: part09/ansible/captures/

  terraform:
    name: Part 9, Terraform plan (mock credentials)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - run: bash scripts/part09-terraform.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-09-terraform
          path: part09/terraform/captures/

  actionlint:
    name: Part 9, actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "linux_amd64.tar.gz" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - run: bash scripts/part09-actionlint.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-09-actionlint
          path: part09/captures/
